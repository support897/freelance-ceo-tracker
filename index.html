<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Freelance Ops">
<meta name="theme-color" content="#047857">
<title>Ilse Placencia — Freelance Operations</title>
<style>
/* ============ Ilse Placencia — Freelance Operations ============
   Neutral professional theme. Fully offline. No external assets. */
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --primary:#111827; --accent:#047857; --accent-soft:#d1fae5;
  --warn:#d97706; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --info:#1d4ed8; --info-soft:#dbeafe; --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  max-width:1100px;margin:0 auto;padding:0 12px 90px;-webkit-text-size-adjust:100%}
h1{font-size:1.15rem} h2{font-size:1.05rem;margin-bottom:10px}
h3{font-size:.95rem}
/* header */
.app-header{background:var(--primary);color:#fff;border-radius:0 0 var(--radius) var(--radius);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem}
.brand p{font-size:.78rem;color:#d1d5db}
.alert-pill{background:var(--warn-soft);color:#92400e;border-radius:20px;
  padding:6px 12px;font-size:.8rem;font-weight:600;border:none;cursor:pointer}
.alert-pill.ok{background:#1f2937;color:#d1d5db}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;position:sticky;top:66px;
  background:var(--bg);z-index:40;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);
  border-radius:20px;padding:8px 14px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
/* cards + grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow)}
.kpi .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .value{font-size:1.35rem;font-weight:700;margin-top:2px}
.kpi .sub{font-size:.75rem;color:var(--muted)}
.positive{color:var(--accent)} .negative{color:var(--bad)} .warning{color:var(--warn)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
/* buttons */
.btn{display:inline-block;border:none;border-radius:8px;padding:9px 14px;font-size:.85rem;
  cursor:pointer;background:var(--primary);color:#fff;font-weight:600;min-height:40px}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:.78rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:12px;
  background:#eef2f7;color:var(--ink)}
.badge.green{background:var(--accent-soft);color:#065f46}
.badge.amber{background:var(--warn-soft);color:#92400e}
.badge.red{background:var(--bad-soft);color:#991b1b}
.badge.blue{background:var(--info-soft);color:#1e40af}
.badge.soon{background:#f3f4f6;color:var(--muted);border:1px dashed #9ca3af}
/* pipeline */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.stage-col{min-width:230px;flex:0 0 230px;background:#eceff3;border-radius:var(--radius);
  padding:10px;scroll-snap-align:start}
.stage-col h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  margin-bottom:8px;display:flex;justify-content:space-between}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.pcard .t{font-weight:600;font-size:.88rem}
.pcard .m{font-size:.75rem;color:var(--muted);margin-top:2px}
.pcard .mv{display:flex;gap:4px;margin-top:8px}
.pcard .mv button{flex:1;border:1px solid var(--line);background:#f9fafb;border-radius:6px;
  padding:6px 0;cursor:pointer;font-size:.8rem;min-height:32px}
/* forms / modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:18px}
@media(min-width:600px){.modal-back{align-items:center}.modal{border-radius:16px}}
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);
  border-radius:8px;padding:10px;font-size:.95rem;font-family:inherit;min-height:42px}
.field textarea{min-height:70px;resize:vertical}
/* lists */
.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:none}
.item-row .grow{flex:1;min-width:0}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:.78rem;min-height:34px}
.icon-btn:hover{background:#f9fafb}
/* misc */
.hint{background:var(--info-soft);border:1px solid #bfdbfe;border-radius:var(--radius);
  padding:12px;font-size:.85rem;color:#1e3a8a;margin-bottom:12px}
.empty{color:var(--muted);font-size:.85rem;padding:14px;text-align:center;border:1px dashed var(--line);
  border-radius:var(--radius);margin:8px 0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.section-title h2{margin:0}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding:8px 0 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bar{width:70%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.bar-label{font-size:.6rem;color:var(--muted);margin-top:4px;white-space:nowrap}
.bar-val{font-size:.62rem;color:var(--ink);font-weight:600}
.progress{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:6px}
.progress > div{height:100%;background:var(--accent)}
.progress.over > div{background:var(--bad)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);
  color:#fff;padding:10px 18px;border-radius:10px;font-size:.85rem;z-index:200;display:none}
.star{color:#f59e0b}
details{margin-top:8px} summary{cursor:pointer;font-size:.85rem;color:var(--info);font-weight:600}
.demo-banner{background:#fef9c3;border:1px solid #fde047;color:#713f12;border-radius:var(--radius);
  padding:10px 14px;font-size:.85rem;font-weight:600;margin-bottom:12px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:.75rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">IP</div>
    <div><h1>Ilse Placencia</h1><p>Freelance Operations</p></div>
  </div>
  <button class="alert-pill ok" id="alertPill" title="Open Deadlines">0 alerts</button>
</header>

<nav class="tabs" id="tabs" aria-label="Modules"></nav>

<main id="view"></main>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";
/* ================================================================
   Ilse Placencia — Freelance Operations
   Single-file dashboard. Data lives in browser localStorage only.
   No network calls, no external assets: works fully offline.
   ================================================================ */

const DB_KEY = "ilse-freelance-ops-v1";

const STAGES = ["lead","bid sent","won","in progress","mockup approved",
  "built","ilse approved","delivered","paid","reviewed"];

const PLATFORMS = ["Fiverr","Upwork","Freelancer.com","Airtasker",
  "Twine (coming soon)","Unjumble (coming soon)","Other"];

const COST_CATS = ["Connects","Tools","Subscriptions","Platform fees","Other"];
const BID_STATUS = ["sent","won","lost","withdrawn"];
const PAY_STATUS = ["pending","paid"];

/* ---------------- data layer ---------------- */
function blankState(){
  return { projects:[], payments:[], costs:[], deadlines:[],
           clients:[], comms:[], bids:[], reviews:[],
           inboxUnread:{fiverr:0,upwork:0,freelancer:0,airtasker:0},
           importedRefs:[],
           settings:{ audPerUsd:1.50, weeklyBidBudget:0, demoLoaded:false } };
}
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return blankState();
    const s = Object.assign(blankState(), JSON.parse(raw));
    s.settings = Object.assign(blankState().settings, s.settings||{});
    return s;
  }catch(e){ return blankState(); }
}
let S = load();
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(S)); }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const money = n => (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-AU",
  {minimumFractionDigits:2, maximumFractionDigits:2});
const toAUD = (amt, cur) => (cur==="USD" ? amt * S.settings.audPerUsd : amt);
const fmtDate = iso => { if(!iso) return "—";
  const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-AU",
  {day:"numeric",month:"short",year:"numeric"}); };
const todayISO = () => { const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const daysUntil = iso => Math.ceil((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/86400000);

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display="none", 2200);
}

/* ---------------- generic modal form ----------------
   openForm(title, fields, values, onSubmit)
   field: {key,label,type:'text'|'number'|'date'|'select'|'textarea'|'checkbox',
           options:[], required, placeholder, step, hint} */
function openForm(title, fields, values, onSubmit){
  values = values || {};
  const root = document.getElementById("modalRoot");
  const back = document.createElement("div");
  back.className = "modal-back";
  const m = document.createElement("div");
  m.className = "modal";
  let html = "<h2>"+esc(title)+"</h2><div style='height:10px'></div>";
  fields.forEach(f=>{
    const v = values[f.key]!=null ? values[f.key] : (f.def||"");
    html += "<div class='field'><label>"+esc(f.label)+
      (f.required?" *":"")+"</label>";
    if(f.type==="select"){
      html += "<select name='"+f.key+"'>"+f.options.map(o=>{
        const val = Array.isArray(o)?o[0]:o, lab = Array.isArray(o)?o[1]:o;
        return "<option value='"+esc(val)+"'"+(String(val)===String(v)?" selected":"")+">"+
          esc(lab)+"</option>";}).join("")+"</select>";
    }else if(f.type==="textarea"){
      html += "<textarea name='"+f.key+"' placeholder='"+esc(f.placeholder||"")+"'>"+esc(v)+"</textarea>";
    }else if(f.type==="checkbox"){
      html += "<input type='checkbox' name='"+f.key+"' style='width:auto;min-height:24px'"+
        (v?" checked":"")+">";
    }else{
      html += "<input type='"+(f.type||"text")+"' name='"+f.key+"' value='"+esc(v)+
        "' placeholder='"+esc(f.placeholder||"")+"'"+
        (f.step?" step='"+f.step+"'":"")+(f.required?" required":"")+">";
    }
    if(f.hint) html += "<div class='note'>"+esc(f.hint)+"</div>";
    html += "</div>";
  });
  html += "<div class='btn-row'><button class='btn' id='fSave'>Save</button>"+
    "<button class='btn secondary' id='fCancel'>Cancel</button></div>";
  m.innerHTML = html; back.appendChild(m); root.appendChild(back);
  const close = ()=>back.remove();
  back.addEventListener("click", e=>{ if(e.target===back) close(); });
  m.querySelector("#fCancel").onclick = close;
  m.querySelector("#fSave").onclick = ()=>{
    const out = {};
    fields.forEach(f=>{
      const el = m.querySelector("[name='"+f.key+"']");
      if(f.type==="checkbox") out[f.key] = el.checked;
      else if(f.type==="number") out[f.key] = el.value===""?null:parseFloat(el.value);
      else out[f.key] = el.value.trim();
    });
    for(const f of fields){
      if(f.required && (out[f.key]==null || out[f.key]==="")){
        toast("Please fill in: "+f.label); return;
      }
    }
    close(); onSubmit(out);
  };
  const first = m.querySelector("input,select,textarea");
  if(first) first.focus();
}

function confirmDelete(label, fn){
  if(confirm("Delete "+label+"? This cannot be undone.")){ fn(); }
}

/* ---------------- export / import / demo ---------------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "freelance-ops-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Backup downloaded");
}
function importJSON(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data || typeof data!=="object" || !Array.isArray(data.projects))
        throw new Error("bad file");
      S = Object.assign(blankState(), data);
      S.settings = Object.assign(blankState().settings, data.settings||{});
      save(); render(); toast("Data imported");
    }catch(e){ toast("That file is not a valid backup"); }
  };
  r.readAsText(file);
}

/* ---------------- shared helpers ---------------- */
function platformOptions(){ return PLATFORMS.map(p=>[p,p]); }
function clientOptions(includeNone){
  const opts = S.clients.map(c=>[c.id,c.name]);
  if(includeNone) opts.unshift(["","— none —"]);
  return opts;
}
function projectOptions(includeNone){
  const opts = S.projects.map(p=>[p.id,p.name]);
  if(includeNone) opts.unshift(["","— none —"]);
  return opts;
}
function clientName(id){ const c=S.clients.find(x=>x.id===id); return c?c.name:"—"; }
function projectName(id){ const p=S.projects.find(x=>x.id===id); return p?p.name:"—"; }
function paidRevenue(){ // sum of paid payments in AUD
  return S.payments.filter(p=>p.status==="paid")
    .reduce((a,p)=>a+toAUD(p.amount||0,p.currency||"AUD"),0);
}
function costsTotal(inclRecurring){
  let t = 0;
  S.costs.forEach(c=>{
    t += toAUD(c.amount||0, c.currency||"AUD");
  });
  return t;
}
function pendingTotal(){
  return S.payments.filter(p=>p.status==="pending")
    .reduce((a,p)=>a+toAUD(p.amount||0,p.currency||"AUD"),0);
}
function revenueByMonth(){
  const map = {};
  S.payments.filter(p=>p.status==="paid").forEach(p=>{
    const m = (p.date||todayISO()).slice(0,7);
    map[m] = (map[m]||0) + toAUD(p.amount||0, p.currency||"AUD");
  });
  return map;
}
function activeDeadlines(){
  return S.deadlines.filter(d=>!d.done)
    .sort((a,b)=>a.dueDate<b.dueDate?-1:1);
}
function alertCount(){
  return activeDeadlines().filter(d=>daysUntil(d.dueDate)<=(d.alertDays||3)).length;
}
function avgResponseMins(clientId){
  const log = S.comms.filter(c=>c.clientId===clientId)
    .sort((a,b)=>a.date<b.date?-1:1);
  const diffs = [];
  for(let i=0;i<log.length;i++){
    if(log[i].dir==="out"){
      for(let j=i-1;j>=0;j--){
        if(log[j].dir==="in"){
          if(log[i].responseMins!=null) diffs.push(log[i].responseMins);
          else {
            const mins = Math.round((new Date(log[i].date+"T12:00")-
              new Date(log[j].date+"T12:00"))/60000);
            if(mins>=0 && mins<60*24*7) diffs.push(mins);
          }
          break;
        }
      }
    }
  }
  if(!diffs.length) return null;
  return Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
}
const fmtResp = mins => mins==null ? "—" :
  mins<60 ? mins+" min" : (mins/60).toFixed(mins%60?1:0)+" h";

/* ---------------- navigation ---------------- */
const TABS = [
  ["dash","Dashboard"],["money","Money"],["pipeline","Pipeline"],
  ["deadlines","Deadlines"],["clients","Clients"],["bids","Bids"],
  ["rep","Reputation"],["platforms","Platforms"],["import","Import"],
  ["settings","Settings"]
];
let currentTab = "dash";
function nav(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(([k,lab])=>
    "<button class='tab"+(k===currentTab?" active":"")+"' data-t='"+k+"'>"+lab+"</button>").join("");
  el.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.t;render();});
}
function updatePill(){
  const n = alertCount();
  const pill = document.getElementById("alertPill");
  pill.textContent = n===0 ? "0 alerts" : n+" alert"+(n>1?"s":"");
  pill.className = "alert-pill"+(n===0?" ok":"");
  pill.onclick = ()=>{ currentTab="deadlines"; render(); window.scrollTo(0,0); };
}

/* ---------------- Dashboard ---------------- */
function viewDash(){
  const rev = paidRevenue(), costs = costsTotal(), pend = pendingTotal();
  const openBids = S.bids.filter(b=>b.status==="sent").length;
  const won = S.bids.filter(b=>b.status==="won").length;
  const decided = S.bids.filter(b=>b.status==="won"||b.status==="lost").length;
  const winRate = decided? Math.round(won/decided*100):0;
  const active = S.projects.filter(p=>!["paid","reviewed"].includes(p.stage)).length;
  const soon = activeDeadlines().filter(d=>daysUntil(d.dueDate)<=(d.alertDays||3));
  const nRev = S.reviews.length;
  const avgR = nRev? (S.reviews.reduce((a,r)=>a+r.rating,0)/nRev).toFixed(1):"—";
  let alerts = "";
  soon.forEach(d=>{
    const du = daysUntil(d.dueDate);
    const lab = du<0 ? "OVERDUE by "+Math.abs(du)+"d" : du===0 ? "Due today" : "Due in "+du+"d";
    alerts += "<div class='item-row'><div class='grow'><b>"+esc(d.title)+"</b><br>"+
      "<span class='note'>"+esc(projectName(d.projectId))+" · "+fmtDate(d.dueDate)+"</span></div>"+
      "<span class='badge "+(du<0?"red":"amber")+"'>"+lab+"</span></div>";
  });
  if(!soon.length) alerts = "<div class='empty'>No deadlines due soon. Nice.</div>";
  const demo = S.settings.demoLoaded ?
    "<div class='demo-banner'><span>DEMO DATA is loaded (all entries are fake)</span>"+
    "<button class='btn small secondary' onclick='clearAll()'>Clear all data</button></div>" : "";
  return demo+
  (S.projects.length===0 && !S.settings.demoLoaded ?
    "<div class='hint'><b>Welcome.</b> This app starts empty — nothing is invented here. "+
    "Add your first client, project or bid to begin. Use Settings to load clearly-labeled demo data for a preview.</div>" : "")+
  "<div class='kpis'>"+
    kpi("Revenue (all time)", money(rev), "paid, in AUD")+
    kpi("Profit", money(rev-costs), "", rev-costs<0?"negative":"positive")+
    kpi("Pending payments", money(pend), S.payments.filter(p=>p.status==="pending").length+" open")+
    kpi("Active projects", active, "not yet paid/reviewed")+
    kpi("Open bids", openBids, "win rate "+winRate+"%")+
    kpi("Avg rating", avgR+(nRev?" ★":""), nRev+" reviews")+
  "</div>"+
  "<div class='card'><h2>Alerts — deadlines due soon</h2>"+alerts+"</div>"+
  "<div class='card'><h2>Quick add</h2><div class='btn-row'>"+
    "<button class='btn small' onclick='addClient()'>+ Client</button>"+
    "<button class='btn small' onclick='addProject()'>+ Project</button>"+
    "<button class='btn small' onclick='addBid()'>+ Bid</button>"+
    "<button class='btn small' onclick='addDeadline()'>+ Deadline</button>"+
    "<button class='btn small' onclick='addPayment()'>+ Payment</button>"+
    "<button class='btn small' onclick='addCost()'>+ Cost</button>"+
  "</div></div>";
}
function kpi(label, value, sub, cls){
  return "<div class='kpi'><div class='label'>"+label+"</div>"+
    "<div class='value "+(cls||"")+"'>"+value+"</div>"+
    (sub?"<div class='sub'>"+sub+"</div>":"")+"</div>";
}

/* ---------------- Money ---------------- */
function fyList(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(); // month 0-based
  const curFY = m>=6 ? y : y-1; // FY starts July
  const list = [];
  for(let f=curFY+1; f>=curFY-3; f--) list.push(f);
  return list;
}
function inFY(iso, fy){
  if(!iso) return false;
  const d = iso.slice(0,10);
  return d >= fy+"-07-01" && d < (fy+1)+"-07-01";
}
let moneyFY = null;
function viewMoney(){
  if(moneyFY===null){ const now=new Date();
    moneyFY = now.getMonth()>=6 ? now.getFullYear() : now.getFullYear()-1; }
  const fy = moneyFY;
  const paid = S.payments.filter(p=>p.status==="paid"&&inFY(p.date,fy));
  const pend = S.payments.filter(p=>p.status==="pending");
  const rev = paid.reduce((a,p)=>a+toAUD(p.amount||0,p.currency||"AUD"),0);
  const costs = S.costs.filter(c=>inFY(c.date,fy))
    .reduce((a,c)=>a+toAUD(c.amount||0,c.currency||"AUD"),0);
  const pendT = pend.reduce((a,p)=>a+toAUD(p.amount||0,p.currency||"AUD"),0);
  const fees = S.costs.filter(c=>c.category==="Platform fees"&&inFY(c.date,fy))
    .reduce((a,c)=>a+toAUD(c.amount||0,c.currency||"AUD"),0);
  const profit = rev-costs;
  // per project
  const perProj = {};
  S.payments.forEach(p=>{
    if(p.projectId && inFY(p.date,fy)){
      const k = p.projectId;
      perProj[k] = perProj[k]||{paid:0,pend:0};
      if(p.status==="paid") perProj[k].paid += toAUD(p.amount||0,p.currency||"AUD");
      else perProj[k].pend += toAUD(p.amount||0,p.currency||"AUD");
    }
  });
  // per platform
  const perPlat = {};
  S.payments.forEach(p=>{
    if(!inFY(p.date,fy)) return;
    const pr = S.projects.find(x=>x.id===p.projectId);
    const plat = pr?pr.platform:"Other";
    perPlat[plat] = perPlat[plat]||{paid:0,pend:0};
    if(p.status==="paid") perPlat[plat].paid += toAUD(p.amount||0,p.currency||"AUD");
    else perPlat[plat].pend += toAUD(p.amount||0,p.currency||"AUD");
  });
  // effective rate
  const hours = S.projects.reduce((a,p)=>a+(p.hoursWorked||0),0);
  const effRate = hours>0 ? rev/hours : null;
  let h = "<div class='section-title'><h2>Money in</h2>"+
    "<select id='fySel' class='icon-btn' onchange='moneyFY=parseInt(this.value);render()'>"+
    fyList().map(f=>"<option value='"+f+"'"+(f===fy?" selected":"")+">FY "+f+"–"+String(f+1).slice(2)+"</option>").join("")+
    "</select></div>";
  h += "<div class='note' style='margin-bottom:10px'>Australian financial year: 1 Jul – 30 Jun. "+
    "Totals shown in AUD (USD converted at "+S.settings.audPerUsd.toFixed(2)+
    ", editable in Settings).</div>";
  h += "<div class='kpis'>"+
    kpi("Revenue FY", money(rev), paid.length+" paid payments")+
    kpi("Costs FY", money(costs), "incl. platform fees "+money(fees))+
    kpi("Profit FY", money(profit), "", profit<0?"negative":"positive")+
    kpi("Pending", money(pendT), pend.length+" open payments")+
  "</div>";
  if(effRate!=null) h += "<div class='card'><b>Effective rate:</b> "+money(effRate)+
    "/hr across "+hours.toFixed(1)+" logged hours <span class='note'>(revenue FY ÷ hours on projects)</span></div>";

  // monthly chart (last 12 months)
  const byM = revenueByMonth();
  const months = [];
  const nowD = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(nowD.getFullYear(), nowD.getMonth()-i, 1);
    months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
  }
  const max = Math.max(1,...months.map(mk=>byM[mk]||0));
  const lab = mk => { const [y,mm]=mk.split("-");
    return ["J","F","M","A","M","J","J","A","S","O","N","D"][parseInt(mm)-1]; };
  h += "<div class='card'><h2>Revenue per month (paid, AUD)</h2><div class='bar-chart'>"+
    months.map(mk=>{ const v=byM[mk]||0;
      return "<div class='bar-col'><div class='bar-val'>"+(v>0?Math.round(v):"")+"</div>"+
      "<div class='bar' style='height:"+Math.max(3,Math.round(v/max*110))+"px'></div>"+
      "<div class='bar-label'>"+lab(mk)+"</div></div>"; }).join("")+
    "</div></div>";

  // per platform
  h += "<div class='card'><h2>Revenue per platform (FY)</h2>";
  const pk = Object.keys(perPlat);
  if(!pk.length) h += "<div class='empty'>No payments in this financial year yet.</div>";
  else { h += "<div class='table-wrap'><table><tr><th>Platform</th><th>Paid</th><th>Pending</th></tr>"+
    pk.map(p=>"<tr><td>"+esc(p)+"</td><td>"+money(perPlat[p].paid)+
      "</td><td>"+money(perPlat[p].pend)+"</td></tr>").join("")+"</table></div>"; }
  h += "</div>";

  // per project
  h += "<div class='card'><div class='section-title' style='margin:0 0 8px'><h2>Revenue per project</h2>"+
    "<button class='btn small' onclick='addPayment()'>+ Payment</button></div>";
  const prk = Object.keys(perProj);
  if(!prk.length) h += "<div class='empty'>No payments recorded yet.</div>";
  else { h += "<div class='table-wrap'><table><tr><th>Project</th><th>Paid</th><th>Pending</th></tr>"+
    prk.map(id=>"<tr><td>"+esc(projectName(id))+"</td><td>"+money(perProj[id].paid)+
      "</td><td>"+money(perProj[id].pend)+"</td></tr>").join("")+"</table></div>"; }
  h += "</div>";

  // payments list
  h += "<div class='card'><div class='section-title' style='margin:0 0 8px'><h2>Payments (pending + milestones)</h2>"+
    "<button class='btn small' onclick='addPayment()'>+ Payment</button></div>";
  if(!S.payments.length) h += "<div class='empty'>No payments yet.</div>";
  else {
    const sorted=[...S.payments].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
    sorted.forEach(p=>{
      h += "<div class='item-row'><div class='grow'><b>"+esc(p.label)+"</b> "+
        "<span class='badge "+(p.status==="paid"?"green":"amber")+"'>"+p.status+"</span><br>"+
        "<span class='note'>"+esc(projectName(p.projectId))+" · "+money(toAUD(p.amount||0,p.currency||"AUD"))+
        " AUD ("+(p.currency||"AUD")+" "+(p.amount||0)+") · "+fmtDate(p.date)+"</span></div>"+
        "<div class='item-actions'>"+
        (p.status==="pending"?"<button class='icon-btn' onclick='markPaid(\""+p.id+"\")'>Mark paid</button>":"")+
        "<button class='icon-btn' onclick='editPayment(\""+p.id+"\")'>Edit</button>"+
        "<button class='icon-btn' onclick='delPayment(\""+p.id+"\")'>✕</button></div></div>";
    });
  }
  h += "</div>";

  // costs
  h += "<div class='card'><div class='section-title' style='margin:0 0 8px'><h2>Costs (FY "+fy+")</h2>"+
    "<button class='btn small' onclick='addCost()'>+ Cost</button></div>";
  const fcosts = S.costs.filter(c=>inFY(c.date,fy)).sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
  if(!fcosts.length) h += "<div class='empty'>No costs recorded. Log Connects, tools and subscriptions here.</div>";
  else { h += "<div class='table-wrap'><table><tr><th>Item</th><th>Category</th><th>Amount (AUD)</th><th>Date</th><th></th></tr>"+
    fcosts.map(c=>"<tr><td>"+esc(c.name)+(c.recurring?" <span class='badge blue'>recurring</span>":"")+"</td>"+
      "<td>"+esc(c.category)+"</td><td>"+money(toAUD(c.amount||0,c.currency||"AUD"))+"</td>"+
      "<td>"+fmtDate(c.date)+"</td>"+
      "<td><button class='icon-btn' onclick='editCost(\""+c.id+"\")'>Edit</button> "+
      "<button class='icon-btn' onclick='delCost(\""+c.id+"\")'>✕</button></td></tr>").join("")+
    "</table></div><div class='note'>Recurring items: re-add each month so the tax record stays clean.</div>"; }
  h += "</div>";
  return h;
}

    h += "<h3 style='margin-top:14px'>Completed</h3>";

  }
  return h;
}

  "</div>";

  return h+"</div>";
}

/* ---------------- CRUD: reviews ---------------- */
function addReview(v){
  openForm(v?"Edit review":"Add review",[
    {key:"platform",label:"Platform",type:"select",options:platformOptions()},
    {key:"clientId",label:"Client",type:"select",options:clientOptions(true)},
    {key:"date",label:"Date",type:"date",def:todayISO()},
    {key:"rating",label:"Rating (1–5)",type:"number",required:true,
      hint:"Whole or half stars, e.g. 4.5"},
    {key:"text",label:"Review text",type:"textarea",
      placeholder:"Paste the client's actual words. Never invent a review."}
  ], v, d=>{
    d.rating=Math.max(1,Math.min(5,parseFloat(d.rating)||0));
    if(v) Object.assign(S.reviews.find(x=>x.id===v.id), d);
    else S.reviews.push(Object.assign({id:uid()}, d));
    save(); render(); toast("Saved");
  });
}
function editReview(id){ addReview(S.reviews.find(x=>x.id===id)); }
function delReview(id){ confirmDelete("this review", ()=>{
  S.reviews=S.reviews.filter(x=>x.id!==id); save(); render(); }); }

    h+="<div class='card'><h2>All reviews</h2>";

      h+="<div class='item-row'><div class='grow'><span class='star'>"+"★".repeat(Math.round(r.rating))+"</span> "+

/* ---------------- Platforms view (multi-platform tracking) ----------------
   One card per live platform. Reads only from existing modules; adds nothing
   to them. Unread counts come from loop imports (S.inboxUnread). */
const LOOP_PLATFORMS = {"fiverr":"Fiverr","upwork":"Upwork",
  "freelancer":"Freelancer.com","airtasker":"Airtasker"};
const LOOP_TYPES = ["bid","message","order","earning","review"];
function loopKeyOf(label){
  return label==="Fiverr"?"fiverr":label==="Upwork"?"upwork":
    label==="Freelancer.com"?"freelancer":label==="Airtasker"?"airtasker":null;
}
function stageProgress(p){
  const i = STAGES.indexOf(p.stage);
  return i<0 ? 0 : Math.round(i/(STAGES.length-1)*100);
}
function platformStats(key){
  const label = LOOP_PLATFORMS[key];
  const bids = S.bids.filter(b=>b.platform===label);
  const projs = S.projects.filter(p=>p.platform===label);
  const active = projs.filter(p=>!["paid","reviewed"].includes(p.stage));
  const paid = projs.filter(p=>["paid","reviewed"].includes(p.stage));
  let earned = 0;
  S.payments.forEach(pay=>{
    if(pay.status!=="paid") return;
    const pr = S.projects.find(x=>x.id===pay.projectId);
    if(pr && pr.platform===label) earned += toAUD(pay.amount||0, pay.currency||"AUD");
  });
  const revs = S.reviews.filter(r=>r.platform===label);
  const avg = revs.length ? revs.reduce((a,r)=>a+r.rating,0)/revs.length : null;
  const unread = (S.inboxUnread && S.inboxUnread[key]) || 0;
  const openBids = bids.filter(b=>b.status==="sent").length;
  return {label:label, active:active, paidCount:paid.length, earned:earned,
    revsCount:revs.length, avg:avg, unread:unread, openBids:openBids,
    bidsTotal:bids.length};
}
function viewPlatforms(){
  let h = "<div class='section-title'><h2>Platforms</h2>"+
    "<button class='btn small' onclick='currentTab=\"import\";render()'>Import loop events</button></div>";
  h += "<div class='note' style='margin-bottom:10px'>One card per live platform. "+
    "Bids, projects, earnings and reviews come from the modules you already use; "+
    "unread messages come from loop imports.</div>";
  Object.keys(LOOP_PLATFORMS).forEach(key=>{
    const s = platformStats(key);
    const projs = S.projects.filter(p=>p.platform===s.label)
      .filter(p=>!["paid","reviewed"].includes(p.stage));
    h += "<div class='card'><div class='section-title' style='margin:0 0 8px'><h2>"+
      esc(s.label)+"</h2>"+
      (s.unread>0 ? "<button class='btn small secondary' onclick='markRead(\""+key+"\")'>"+
        "Mark "+s.unread+" read</button>" : "")+"</div>";
    h += "<div class='kpis'>"+
      kpi("Open bids", s.openBids, s.bidsTotal+" bids total")+
      kpi("Active projects", projs.length, s.paidCount+" paid")+
      kpi("Earned", money(s.earned), "paid, AUD")+
      kpi("Rating", s.avg!=null ? s.avg.toFixed(1)+" ★" : "—", s.revsCount+" reviews")+
      kpi("Unread", s.unread, "messages")+
      "</div>";
    if(projs.length){
      h += "<h3 style='margin:8px 0 6px'>Active projects</h3>"+
        "<div class='table-wrap'><table><tr><th>Project</th><th>Progress</th><th>Price</th></tr>";
      projs.forEach(p=>{
        const pct = stageProgress(p);
        h += "<tr><td>"+esc(p.name)+"<br><span class='note'>"+esc(p.stage)+"</span></td>"+
          "<td style='min-width:120px'><div class='progress'><div style='width:"+pct+"%'></div></div>"+
          "<span class='note'>"+pct+"%</span></td>"+
          "<td>"+((p.value!=null && p.value!=="") ? esc(p.currency||"AUD")+" "+p.value : "—")+"</td></tr>";
      });
      h += "</table></div>";
    } else {
      h += "<div class='empty'>No active projects on "+esc(s.label)+".</div>";
    }
    h += "</div>";
  });
  return h;
}
function markRead(key){
  if(!S.inboxUnread) S.inboxUnread = {};
  S.inboxUnread[key] = 0; save(); render(); toast("Marked read");
}

/* ---------------- Import view (loop events JSONL) ----------------
   Paste JSONL or choose a .jsonl file. Validates each line, dedupes on
   ts+ref+type, and merges additively: bids -> Bids, orders -> projects,
   earnings -> payments (Money), messages -> unread counter, reviews noted
   but never stored (schema has no rating — never invent one). */
function viewImport(){
  const sample1 = '{"ts":"2026-10-18T09:12:00+10:00","platform":"upwork","type":"bid","ref":"bid-8821","summary":"n8n order-sync automation","amount":400,"currency":"USD"}';
  const sample2 = '{"ts":"2026-10-18T09:40:00+10:00","platform":"fiverr","type":"earning","ref":"ord-551","summary":"Chatbot milestone 2","amount":225,"currency":"AUD"}';
  let h = "<div class='section-title'><h2>Import loop events</h2></div>";
  h += "<div class='hint'><b>Format:</b> one JSON object per line — "+
    "{ts, platform, type, ref, summary, amount, currency}<br>"+
    "platform: fiverr | upwork | freelancer | airtasker · "+
    "type: bid | message | order | earning | review<br><br>"+
    "<b>Samples:</b><pre style='white-space:pre-wrap;font-size:.72rem;margin:6px 0 0'>"+
    esc(sample1)+"\n"+esc(sample2)+"</pre>"+
    "<div class='note' style='margin-top:8px'>Same row twice is never double-counted: "+
    "rows are deduped on ts + ref + type. Nothing is overwritten.</div></div>";
  h += "<div class='card'><div class='field'><label>Paste JSONL</label>"+
    "<textarea id='jsonlBox' style='min-height:140px' "+
    "placeholder='One JSON object per line…'></textarea></div>"+
    "<div class='btn-row'><button class='btn small' onclick='importJSONL()'>Import pasted rows</button>"+
    "<label class='btn small secondary' style='cursor:pointer'>Choose .jsonl file"+
    "<input type='file' id='jsonlFile' accept='.jsonl,.txt' style='display:none' "+
    "onchange='importJSONLFile(this.files[0])'></label></div>"+
    "<div id='importResult'></div></div>";
  return h;
}
function parseLoopLine(line){
  const o = JSON.parse(line);
  if(!o || typeof o!=="object") throw new Error("not an object");
  if(!o.ts || typeof o.ts!=="string") throw new Error("missing ts");
  if(!LOOP_PLATFORMS[o.platform]) throw new Error("bad platform: "+o.platform);
  if(LOOP_TYPES.indexOf(o.type)<0) throw new Error("bad type: "+o.type);
  if(!o.ref) throw new Error("missing ref");
  if(!o.summary || typeof o.summary!=="string") throw new Error("missing summary");
  const amount = o.amount==null ? null : Number(o.amount);
  if(amount!=null && !isFinite(amount)) throw new Error("bad amount");
  const currency = o.currency || "USD";
  if(currency!=="USD" && currency!=="AUD") throw new Error("bad currency");
  return {ts:o.ts, platform:o.platform, type:o.type, ref:String(o.ref),
    summary:o.summary, amount:amount, currency:currency};
}
function importLoopEvents(text){
  const lines = text.split(/\r?\n/);
  let imp=0, skip=0, madeBids=0, madeProjects=0, madePayments=0, unread=0, noted=0;
  const errors = [];
  lines.forEach((raw, idx)=>{
    const line = raw.trim(); if(!line) return;
    let ev;
    try{ ev = parseLoopLine(line); }
    catch(e){ skip++; if(errors.length<3) errors.push("line "+(idx+1)+": "+e.message); return; }
    const dk = ev.type+"|"+ev.ts+"|"+ev.ref;
    if(S.importedRefs.indexOf(dk)>=0){ skip++; return; }
    S.importedRefs.push(dk);
    const label = LOOP_PLATFORMS[ev.platform];
    const day = (ev.ts||"").slice(0,10) || todayISO();
    const via = "Imported loop event · ref "+ev.ref+" · "+ev.ts;
    if(ev.type==="bid"){
      S.bids.push({id:uid(), title:ev.summary, clientId:"", platform:label, date:day,
        bidAmount:ev.amount, currency:ev.currency, connectsUsed:null, connectsCost:null,
        status:"sent", notes:via});
      madeBids++;
    }else if(ev.type==="order"){
      S.projects.push({id:uid(), name:ev.summary, clientId:"", platform:label, stage:"won",
        value:ev.amount, currency:ev.currency, hoursWorked:0, notes:via});
      madeProjects++;
    }else if(ev.type==="earning"){
      S.payments.push({id:uid(), projectId:"", label:ev.summary, amount:ev.amount,
        currency:ev.currency, status:"paid", date:day});
      madePayments++;
    }else if(ev.type==="message"){
      if(!S.inboxUnread) S.inboxUnread = {};
      S.inboxUnread[ev.platform] = (S.inboxUnread[ev.platform]||0)+1; unread++;
    }else if(ev.type==="review"){
      noted++; // schema has no rating — never invent one
    }
    imp++;
  });
  save();
  return {imp:imp, skip:skip, madeBids:madeBids, madeProjects:madeProjects,
    madePayments:madePayments, unread:unread, noted:noted, errors:errors};
}
function showImportResult(r){
  const el = document.getElementById("importResult");
  let h = "<div class='card' style='margin-top:12px'><b>Imported "+r.imp+
    "</b>, skipped "+r.skip+".<br>"+
    "<span class='note'>Created: "+r.madeBids+" bids · "+r.madeProjects+" projects · "+
    r.madePayments+" payments · +"+r.unread+" unread messages · "+
    r.noted+" reviews noted (no rating in data — not stored).</span>";
  if(r.errors.length)
    h += "<div class='note' style='color:var(--bad)'>"+r.errors.map(esc).join("<br>")+"</div>";
  h += "</div>";
  el.innerHTML = h;
  toast("Import done: "+r.imp+" imported, "+r.skip+" skipped");
}
function importJSONL(){
  showImportResult(importLoopEvents(document.getElementById("jsonlBox").value));
}
function importJSONLFile(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = ()=>{ showImportResult(importLoopEvents(String(fr.result))); };
  fr.readAsText(file);
}
